name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The first run compiles TDLib from source (30-60+ minutes). Later runs reuse the cached result.
    timeout-minutes: 180

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # ---- TDLib: official Telegram source, built with Telegram's own Docker recipe ----
      - name: Restore cached TDLib build
        id: tdlib-cache
        uses: actions/cache/restore@v4
        with:
          path: tdlib-out
          key: tdlib-official-v1

      - name: Build TDLib from official source
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/tdlib/td.git "$RUNNER_TEMP/td"
          cd "$RUNNER_TEMP/td/example/android"
          DOCKER_BUILDKIT=1 docker build --output "$GITHUB_WORKSPACE/tdlib-out" .
          cd "$GITHUB_WORKSPACE"
          # keep the cache small: we only need the libs and the Java sources
          find tdlib-out -name '*.zip' -delete
          rm -rf tdlib-out/javadoc tdlib-out/*/javadoc
          echo "--- TDLib build output ---"
          find tdlib-out -maxdepth 4 | head -60

      - name: Save TDLib build to cache
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tdlib-out
          key: tdlib-official-v1

      - name: Copy TDLib into the app
        run: |
          TDAPI=$(find tdlib-out -name TdApi.java | head -n 1)
          LIBS=$(find tdlib-out -name libtdjni.so)
          if [ -z "$TDAPI" ] || [ -z "$LIBS" ]; then
            echo "TDLib output is missing TdApi.java or libtdjni.so:"
            find tdlib-out | head -80
            exit 1
          fi
          SRC_ROOT="${TDAPI%/org/drinkless/tdlib/TdApi.java}"
          if [ "$SRC_ROOT" = "$TDAPI" ]; then
            echo "Unexpected TdApi.java location: $TDAPI"
            exit 1
          fi
          mkdir -p app/src/main/java app/src/main/jniLibs
          cp -r "$SRC_ROOT"/. app/src/main/java/
          for so in $LIBS; do
            abi=$(basename "$(dirname "$so")")
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$so" "app/src/main/jniLibs/$abi/"
          done
          echo "Java sources:"; find app/src/main/java/org -name '*.java'
          echo "Native libs:"; find app/src/main/jniLibs -name '*.so'

      # ---- Android app ----
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The ubuntu runner already ships with the Android SDK (ANDROID_HOME). Accept licenses
      # so Gradle can auto-download any missing platform/build-tools.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramPhotoSaver-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
